<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Byte N Sip: coffee and code</title>
  <desc id="desc">A warmly lit cafe desk with an open laptop displaying code, fresh coffee, and subtle circuit details.</desc>
